# Render Blueprint: InsightReview AI on the free plan.
# Postgres is external (e.g. Neon free tier). Qdrant runs in-process and is rebuilt from Postgres on startup.
services:
  - type: web
    name: insightreview-api
    runtime: docker
    plan: free
    dockerfilePath: ./docker/Dockerfile.api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: LLM_API_KEY
        sync: false # Groq API key
      - key: GOOGLE_API_KEY
        sync: false # Gemini API key (embeddings)
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: EMBED_PROVIDER
        value: gemini
      - key: QDRANT_URL
        value: ":memory:"
      - key: AUTO_BOOTSTRAP
        value: "true"
      - key: DEMO_READ_ONLY
        value: "true"
      - key: ENABLE_SCRAPING
        value: "false"
      - key: QA_RATE_LIMIT_PER_HOUR
        value: "30"

  - type: web
    name: insightreview-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./docker/Dockerfile.streamlit
    envVars:
      - key: API_BASE_URL
        value: https://insightreview-api.onrender.com/api/v1
